apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels: {{- include "stonk.labels" . | nindent 4 }}
spec:
  selector: {{- include "stonk.sel" (list . "frontend") | nindent 4 }}
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels: {{- include "stonk.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "stonk.sel" (list . "frontend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "stonk.sel" (list . "frontend") | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ include "stonk.image" (list . .Values.image.frontend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
