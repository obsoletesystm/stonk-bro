apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env
  labels: {{- include "stonk.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.dbUser | quote }}
  POSTGRES_DB: {{ .Values.secrets.dbName | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.secrets.dbUser (.Values.secrets.dbPassword | urlquery) .Release.Name .Values.secrets.dbName | quote }}
  ALPHA_VANTAGE_KEY: {{ .Values.secrets.alphaVantageKey | quote }}
  NEWS_API_KEY: {{ .Values.secrets.newsApiKey | quote }}
  REDDIT_CLIENT_ID: {{ .Values.secrets.redditClientId | quote }}
  REDDIT_CLIENT_SECRET: {{ .Values.secrets.redditClientSecret | quote }}
  REDDIT_USER_AGENT: {{ .Values.secrets.redditUserAgent | quote }}
  DISCORD_WEBHOOK_URL: {{ .Values.secrets.discordWebhookUrl | quote }}
