apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "stonk.labels" . | nindent 4 }}
spec:
  selector: {{- include "stonk.sel" (list . "api") | nindent 4 }}
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "stonk.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "stonk.sel" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "stonk.sel" (list . "api") | nindent 8 }}
    spec:
      containers:
        - name: api
          image: {{ include "stonk.image" (list . .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          {{- include "stonk.backendEnv" . | nindent 10 }}
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: ml-models
              mountPath: /app/ml/artifacts
      volumes:
        - name: ml-models
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-ml-models
