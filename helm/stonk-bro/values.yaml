# Put real secrets in a separate file that is not committed:
#   helm upgrade --install stonk-bro helm/stonk-bro -n stonk-bro --create-namespace -f values.local.yaml

image:
  # Built locally and imported into k3s (see NOTES.txt). Bump the tag on every build:
  # IfNotPresent will not re-pull an image that has the same tag.
  backend: stonk-bro/api
  frontend: stonk-bro/frontend
  tag: "0.1.0"
  pullPolicy: IfNotPresent

ingress:
  className: traefik
  host: stonks.local

config:
  environment: production
  logLevel: info
  tfsaBirthYear: "1990"
  tfsaInitialContributionRoom: "95000"

# Secret values. Override in values.local.yaml.
secrets:
  dbUser: stockuser
  dbName: stockdb
  dbPassword: change-me
  alphaVantageKey: ""
  newsApiKey: ""
  redditClientId: ""
  redditClientSecret: ""
  redditUserAgent: "stonk-bro:v1.0.0 (by /u/your_reddit_username)"
  discordWebhookUrl: ""

collector:
  schedule: "0 * * * *"   # hourly: queues the Reddit and news collection tasks

postgres:
  image: timescale/timescaledb:latest-pg15
  storage: 20Gi
  resources:
    requests: { memory: 1Gi, cpu: 250m }
    limits: { memory: 8Gi, cpu: "2" }

redis:
  image: redis:7-alpine
  resources:
    requests: { memory: 128Mi, cpu: 50m }
    limits: { memory: 2Gi, cpu: 500m }

api:
  resources:
    requests: { memory: 512Mi, cpu: 100m }
    limits: { memory: 2Gi, cpu: "1" }

worker:
  concurrency: 2
  resources:
    requests: { memory: 512Mi, cpu: 100m }
    limits: { memory: 4Gi, cpu: "2" }

frontend:
  resources:
    requests: { memory: 32Mi, cpu: 10m }
    limits: { memory: 256Mi, cpu: 250m }

mlModels:
  storage: 5Gi
